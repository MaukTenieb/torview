# CI — vet + tests on 3 OS, headless cross-builds, and automated release.
#
# Honesty notes (mirror README.md):
#   - ubuntu/macos jobs run vet+test+headless build; the FULL linux/macos
#     binaries compile here but are NOT executed (no webview runtime check).
#   - The release job rebuilds the exact Windows zip (official Tor bundle
#     fetched + digest-verified on the runner) and attaches it to the tag.
name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go version
      - run: go vet .
      - run: go test -v .
      - name: Headless build (no webview)
        run: go build -tags nowebview -o torview-smoke .
      - name: Full build (native webview path, cgo on macOS)
        run: go build -o torview-build-check .
      - name: darwin nocgo stub compiles (GOOS=darwin CGO_ENABLED=0)
        if: runner.os == 'Linux'
        run: GOOS=darwin CGO_ENABLED=0 go build -tags nowebview -o /dev/null .

  fetch-tor-check:
    # Proves --fetch-tor on Linux: official index parse, bundle download,
    # digest verification against sha256sums-signed-build.txt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go build -tags nowebview -o torview .
      - run: ./torview --fetch-tor
      - run: test -x bin/tor/tor

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, fetch-tor-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build torview.exe (commit injected)
        shell: bash
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          go vet .
          go test .
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.buildCommit=$COMMIT" -o dist/pkg/torview.exe .
      - name: Fetch official Tor bundle (digest verified)
        shell: bash
        run: go run . --fetch-tor
      - name: Smoke on the runner (real exit-relay proof)
        shell: bash
        run: go run . --smoke
      - name: Assemble zip
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE, SECURITY.md -Destination dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/torview-windows-x64.zip -Force
          $h = (Get-FileHash dist/torview-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h *torview-windows-x64.zip" | Out-File -Encoding ascii dist/torview-windows-x64.zip.sha256
          Get-Content dist/torview-windows-x64.zip.sha256
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/torview-windows-x64.zip
            dist/torview-windows-x64.zip.sha256
